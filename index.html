<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ClientBook">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>ClientBook</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#111114; --muted:#6e6e73; --sep:#d8d8dd; --sep2:#c4c4c9;
  --input:#e4e4e9; --press:#ececf0; --bar:rgba(242,242,247,.86);
  --accent:#556b2f; --accent-soft:#e8eddc; --danger:#d70015;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989f; --sep:#323236; --sep2:#48484c;
    --input:#2c2c2e; --press:#2c2c2e; --bar:rgba(18,18,20,.86);
    --accent:#a9bf73; --accent-soft:#252c17; --danger:#ff453a; --on-accent:#18200b;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang HK","Microsoft JhengHei",sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));min-height:100vh}
body.locked{overflow:hidden}
main{max-width:720px;margin:0 auto;padding:0 16px}
a{color:var(--accent)}
button{font:inherit;color:inherit}
svg{display:block}

/* top bar */
.top{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
h1{font-size:32px;line-height:1.15;font-weight:700;margin:0;letter-spacing:-.01em}
.icon-btn{width:38px;height:38px;border-radius:19px;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none}
.link-btn{background:none;border:0;color:var(--accent);font-size:17px;padding:8px 0;cursor:pointer}
.link-btn:disabled{color:var(--muted);opacity:.6}
.back{color:var(--accent);text-decoration:none;display:flex;align-items:center;font-size:17px;margin-left:-8px;padding:8px 0}

/* search */
.search{display:flex;align-items:center;gap:6px;background:var(--input);border-radius:10px;padding:0 10px;height:38px;margin-top:6px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:17px;color:var(--text);outline:none;min-width:0;height:100%;padding:0}
.search input::placeholder{color:var(--muted)}

/* lists */
.count,.sec-h{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:14px 4px 0;display:flex;justify-content:space-between;align-items:center}
.list{background:var(--card);border-radius:12px;overflow:hidden;margin:8px 0 12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:58px;color:inherit;text-decoration:none;position:relative;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.row + .row::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:top}
.row:active{background:var(--press)}
.row:disabled{cursor:default}
.row:disabled .main,.row:disabled .idb{opacity:.5}
.idb{flex:none;min-width:60px;max-width:116px;padding:4px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  font:600 14px/1.25 ui-monospace,"SF Mono",Menlo,monospace;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idb.lg{font-size:15px;padding:5px 10px;max-width:none;display:inline-block}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--sep2);flex:none}
.tag{font-size:12px;color:var(--muted);background:var(--input);padding:2px 8px;border-radius:10px;flex:none}
.ck{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--sep2);display:grid;place-items:center;flex:none;color:var(--on-accent,#fff)}

/* delivery days */
.dayf{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
.dayf button,.days button{border:0;border-radius:9px;height:32px;background:var(--input);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;padding:0;position:relative}
.dayf button.on,.days button.on{background:var(--accent);color:var(--on-accent,#fff)}
.dayf button.today::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:currentColor;opacity:.6}
.f.fd{flex-direction:column;align-items:stretch;padding:12px 14px}
.f.fd > span{width:auto}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.days button{height:36px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.idrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.idrow .chips{margin-top:0;justify-content:flex-end}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.btn2 .primary{margin:0;height:38px;font-size:15px;border-radius:10px;gap:4px}
.btn2 .primary svg{width:16px;height:16px}
.primary.alt{background:var(--accent-soft);color:var(--accent)}
.idb.pr{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);position:relative;isolation:isolate;overflow:hidden;min-width:72px;min-height:38px;display:inline-flex;align-items:center;justify-content:center}
.idb.pr::after{content:"PROMO";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-27deg);z-index:-1;
  font:900 13px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.04em;color:var(--accent);opacity:.26;pointer-events:none;white-space:nowrap}
.idb.lg.pr{min-height:40px;min-width:84px}
.idb.lg.pr::after{font-size:14px}
.empty.sm{padding:14px 20px;font-size:15px;background:var(--card);border-radius:12px;margin:8px 0 12px}
.dayf.seg{grid-template-columns:repeat(3,1fr)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--sep2);position:relative;flex:none;transition:background .2s;border:0;padding:0;cursor:pointer;display:block}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.swl{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer}
.swl.on{color:var(--accent)}
.mini{margin:10px 0 0}
.mini .row{min-height:46px;cursor:default}
.row.on .ck{background:var(--accent);border-color:var(--accent)}
.row:disabled .ck{background:var(--sep2);border-color:var(--sep2)}
.empty{text-align:center;color:var(--muted);padding:44px 20px;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:19px;margin-bottom:4px}
.empty .primary{margin-top:18px;max-width:240px}

/* detail */
.hero{padding:4px 0 6px}
.hero h1{margin-top:8px;font-size:28px}
.meta{display:inline-flex;align-items:center;gap:6px;margin-top:6px;text-decoration:none;font-size:16px}
.notes{margin:8px 0 0;color:var(--muted);font-size:15px;white-space:pre-wrap}
.primary{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--on-accent,#fff);border:0;border-radius:12px;height:50px;font-weight:600;font-size:17px;width:100%;cursor:pointer;margin:10px 0 4px}
.primary:active{opacity:.85}

/* data page */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.stat{background:var(--card);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.help{font-size:13px;color:var(--muted);padding:6px 4px 0;line-height:1.5;margin:0}
.help code{font-size:12px;color:var(--text)}
.help.center{text-align:center;padding:16px 0}
.row.act .name.red{color:var(--danger)}
.tip{background:var(--accent-soft);color:var(--text);border-radius:12px;padding:12px 14px;font-size:14px;margin:10px 0}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tab{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none}
.tab.on{color:var(--accent)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:92vh;max-height:92dvh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;
  animation:up .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 16px;border-bottom:.5px solid var(--sep);gap:8px}
.sh b{font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sh .l{justify-self:start}.sh .r{justify-self:end;font-weight:600}
.sb{overflow:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch;margin:0}
.sb .search{margin:0 0 4px}
.field{background:var(--card);border-radius:12px;overflow:hidden}
.f{display:flex;align-items:center;padding:0 14px;min-height:48px;position:relative;gap:10px}
.f + .f::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.f > span{width:104px;flex:none}
.f.fa{align-items:flex-start}
.f.fa > span{padding-top:13px}
.f input,.f textarea{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--text);outline:none;padding:13px 0;resize:none}
.err{color:var(--danger);font-size:14px;padding:8px 4px 0;min-height:1em}
.danger-btn{width:100%;height:48px;border:0;border-radius:12px;background:var(--card);color:var(--danger);font-size:17px;margin-top:16px;cursor:pointer}
.sheet-note{font-size:14px;color:var(--muted);padding:10px 4px 0}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:rgba(28,28,30,.94);color:#fff;
  padding:10px 16px;border-radius:20px;font-size:15px;transition:opacity .2s,transform .2s;z-index:30;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabbar">
  <a class="tab" data-tab="clients" href="#/clients">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg>
    Clients</a>
  <a class="tab" data-tab="stock" href="#/stock">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.5 12 3 3 7.5v9L12 21l9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>
    Stock</a>
  <a class="tab" data-tab="promo" href="#/promo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.2V4.5A1.5 1.5 0 0 1 4.5 3h7.7a1.5 1.5 0 0 1 1 .44l7.4 7.4a1.5 1.5 0 0 1 0 2.12l-7.7 7.7a1.5 1.5 0 0 1-2.12 0l-7.4-7.4a1.5 1.5 0 0 1-.38-1.06z"/><circle cx="8" cy="8" r="1.6"/></svg>
    Promo</a>
  <a class="tab" data-tab="data" href="#/data">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v14M3 14l4 4 4-4M17 20V6M13 10l4-4 4 4"/></svg>
    Import / Export</a>
</nav>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ---------- storage ---------- */
const KEY = 'clientbook-v1', LAST = 'clientbook-lastbackup';
let db = load();

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.clients) && Array.isArray(d.stock)) return normalizeDB(d); }catch(e){}
  return {v:2, clients:[], stock:[], promos:[]};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Could not save — storage may be full'); }
}
function normalizeDB(d){
  const s = x => String(x ?? '').trim();
  const v1 = !(d.v >= 2);   // version 1 stored "brand" in the old "unit" field
  const stock = [], clients = [], seenS = new Set(), seenC = new Set();
  for(const x of d.stock || []){ const id = s(x.id); if(!id || seenS.has(id)) continue; seenS.add(id);
    stock.push(v1 && x.brand === undefined ? {id, name:s(x.name), brand:s(x.unit), unit:'', notes:s(x.notes)}
                                           : {id, name:s(x.name), brand:s(x.brand), unit:s(x.unit), notes:s(x.notes)}); }
  for(const x of d.clients || []){ const id = s(x.id); if(!id || seenC.has(id)) continue; seenC.add(id);
    const items = [], seen = new Set();
    for(const i of Array.isArray(x.items) ? x.items : []){ const sid = s(i.stockId); if(!sid || seen.has(sid)) continue; seen.add(sid);
      items.push({stockId:sid, note:s(i.note), added:s(i.added)}); }
    const prs = [], seenPr = new Set();
    for(const i of Array.isArray(x.promos) ? x.promos : []){ const pid = s(i.promoId); if(!pid || seenPr.has(pid)) continue; seenPr.add(pid);
      prs.push({promoId:pid, note:s(i.note), added:s(i.added)}); }
    clients.push({id, name:s(x.name), phone:s(x.phone), days:cleanDays(x.days), notes:s(x.notes), items, promos:prs}); }
  const promos = [], seenP = new Set();
  for(const x of Array.isArray(d.promos) ? d.promos : []){ const id = s(x.id); if(!id || seenP.has(id)) continue; seenP.add(id);
    promos.push({id, name:s(x.name), active: x.active !== false, stockIds:[...new Set((Array.isArray(x.stockIds) ? x.stockIds : []).map(s).filter(Boolean))], notes:s(x.notes)}); }
  return {v:2, clients, stock, promos};
}
function cleanDays(a){ return Array.isArray(a) ? [...new Set(a.map(Number).filter(n => Number.isInteger(n) && n >= 0 && n <= 6))].sort() : []; }
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cmp = (a,b) => String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:'base'});
const byId = (a,b) => cmp(a.id, b.id);
const getClient = id => db.clients.find(c => c.id === id);
const getStock = id => db.stock.find(s => s.id === id);
const getPromo = id => db.promos.find(p => p.id === id);
const stockSub = s => [s.brand, s.unit].filter(Boolean).join(' · ');
const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;
const enc = encodeURIComponent;
function match(q, ...fields){
  const t = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!t.length) return true;
  const hay = fields.join(' ').toLowerCase();
  return t.every(x => hay.includes(x));
}
function localDate(d = new Date()){ const z = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function fmtDate(s){ if(!s) return ''; const d = new Date(s.length <= 10 ? s + 'T00:00:00' : s); if(isNaN(d)) return s;
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); }
function nextId(list, prefix){
  const ids = list.map(x => x.id).sort(cmp);
  for(let i = ids.length - 1; i >= 0; i--){
    const m = ids[i].match(/^(.*?)(\d+)$/);
    if(m){ const cand = m[1] + String(+m[2] + 1).padStart(m[2].length, '0'); if(!list.some(x => x.id === cand)) return cand; }
  }
  let n = 1; while(list.some(x => x.id === prefix + String(n).padStart(3,'0'))) n++;
  return prefix + String(n).padStart(3,'0');
}
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const todayIdx = () => (new Date().getDay() + 6) % 7;
function fmtDays(d){
  if(!d || !d.length) return ''; if(d.length === 7) return 'Daily';
  const out = []; let i = 0;
  while(i < d.length){ let j = i; while(j + 1 < d.length && d[j + 1] === d[j] + 1) j++;
    if(j - i >= 2) out.push(DAYS[d[i]] + '–' + DAYS[d[j]]); else for(let k = i; k <= j; k++) out.push(DAYS[d[k]]);
    i = j + 1; }
  return out.join(' ');
}
function parseDays(str){
  const t = String(str || '').toLowerCase();
  if(!t.trim()) return [];
  if(/daily|every ?day|每日|每天/.test(t)) return [0,1,2,3,4,5,6];
  const out = [];
  const names = [['mon','一'],['tue','二'],['wed','三'],['thu','四'],['fri','五'],['sat','六'],['sun','日','天']];
  const idx = w => { const n = names.findIndex(n => n.some(k => w.startsWith(k))); return n; };
  t.replace(/(?:星期|週|周|禮拜)?([a-z一二三四五六日天]+)\s*[-–~至到]\s*(?:星期|週|周|禮拜)?([a-z一二三四五六日天]+)/g, (m, x, y) => { const a = idx(x), b = idx(y);
    if(a >= 0 && b >= 0){ for(let k = a; k !== b; k = (k + 1) % 7) out.push(k); out.push(b); } return m; });
  for(const part of t.split(/[\s,;\/|、&+]+/).filter(Boolean)){
    names.forEach((n, i) => { if(n.some(k => part.startsWith(k) || (k.length === 1 && part.includes(k)))) out.push(i); });
    if(/^[1-7]$/.test(part)) out.push(+part - 1);
  }
  return cleanDays(out);
}
let toastT;
function toast(msg, ms = 2600){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }

const I = {
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>',
  chev:'<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
  back:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  phone:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h3.5l1.8 4.6-2.4 1.5a11 11 0 0 0 6.5 6.5l1.5-2.4 4.6 1.8V19a1.6 1.6 0 0 1-1.7 1.6A16.6 16.6 0 0 1 3.4 5.2 1.6 1.6 0 0 1 5 3.5z"/></svg>'
};
const searchBox = (id, ph, val) => `<div class="search">${I.search}<input id="${id}" type="search" placeholder="${esc(ph)}" value="${esc(val)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>`;
const topbar = (title, right = '', below = '') => `<header class="top"><div class="bar"><h1>${esc(title)}</h1>${right}</div>${below}</header>`;
const backbar = (href, label, right = '') => `<header class="top"><div class="bar"><a class="back" href="${href}">${I.back}${esc(label)}</a>${right}</div></header>`;
const emptyHTML = (title, text, btnId, btnLabel) => `<div class="empty"><b>${esc(title)}</b>${text}${btnId ? `<button class="primary" id="${btnId}">${I.plus} ${esc(btnLabel)}</button>` : ''}</div>`;

/* ---------- router ---------- */
const state = {qc:'', qs:'', qp:'', pf:'all', day:null};
const scrollMem = {};
let curHash = '';
function route(){
  if(curHash) scrollMem[curHash] = window.scrollY;
  closeSheet();
  const h = location.hash.replace(/^#/, '') || '/clients';
  curHash = h;
  const [p, raw] = h.split('/').slice(1);
  const id = raw !== undefined && raw !== '' ? decodeURIComponent(raw) : null;
  if(p === 'client' && id !== null) viewClient(id);
  else if(p === 'stock' && id !== null) viewStockItem(id);
  else if(p === 'stock') viewStock();
  else if(p === 'promo' && id !== null) viewPromo(id);
  else if(p === 'promo') viewPromos();
  else if(p === 'data') viewData();
  else viewClients();
  window.scrollTo(0, (h === '/clients' || h === '/stock' || h === '/promo' || h === '') ? (scrollMem[h] || 0) : 0);
}
function setTab(name){ document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === name)); }
window.addEventListener('hashchange', route);

/* ---------- sheet ---------- */
function openSheet(html){
  const root = $('#sheet-root');
  root.innerHTML = `<div class="ov"><div class="panel" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.classList.add('locked');
  root.querySelector('.ov').addEventListener('click', e => { if(e.target.classList.contains('ov') || e.target.closest('[data-x]')) closeSheet(); });
}
function closeSheet(){ $('#sheet-root').innerHTML = ''; document.body.classList.remove('locked'); }

function formSheet({title, fields, saveLabel = 'Save', onSave, onDelete, deleteLabel = 'Delete', extra = ''}){
  openSheet(`<div class="sh"><button class="link-btn l" data-x>Cancel</button><b>${esc(title)}</b><button class="link-btn r" id="fsave">${esc(saveLabel)}</button></div>
  <form class="sb" id="fform" autocomplete="off"><div class="field">${fields.map(f => f.toggle
    ? `<div class="f"><span>${esc(f.label)}</span><span style="flex:1"></span><button type="button" class="sw${f.value ? ' on' : ''}" data-sw="${f.k}" role="switch" aria-label="${esc(f.label)}"></button></div>`
    : f.days
    ? `<div class="f fd"><span>${esc(f.label)}</span><div class="days" data-k="${f.k}">${DAYS.map((d, i) => `<button type="button" data-i="${i}" class="${f.value.includes(i) ? 'on' : ''}">${d}</button>`).join('')}</div></div>`
    : `<label class="f${f.area ? ' fa' : ''}"><span>${esc(f.label)}</span>${
    f.area ? `<textarea name="${f.k}" rows="3" placeholder="${esc(f.ph || '')}">${esc(f.value)}</textarea>`
           : `<input name="${f.k}" type="${f.type || 'text'}" value="${esc(f.value)}" placeholder="${esc(f.ph || '')}" autocapitalize="${f.ac || 'sentences'}" autocorrect="off" spellcheck="false" enterkeyhint="done">`
  }</label>`).join('')}</div><div class="err" id="ferr"></div>${extra}${onDelete ? `<button type="button" class="danger-btn" id="fdel">${esc(deleteLabel)}</button>` : ''}<button type="submit" hidden></button></form>`);
  const form = $('#fform');
  const submit = e => { if(e) e.preventDefault(); const v = {};
    fields.forEach(f => v[f.k] = f.toggle ? form.querySelector(`[data-sw="${f.k}"]`).classList.contains('on')
      : f.days ? [...form.querySelectorAll(`.days[data-k="${f.k}"] .on`)].map(b => +b.dataset.i) : form.elements[f.k].value.trim());
    const err = onSave(v); if(err) $('#ferr').textContent = err; };
  form.addEventListener('click', e => { const b = e.target.closest('.days button, [data-sw]'); if(b) b.classList.toggle('on'); });
  form.addEventListener('submit', submit);
  $('#fsave').onclick = submit;
  if(onDelete) $('#fdel').onclick = onDelete;
}

/* ---------- clients ---------- */
function viewClients(){
  setTab('clients');
  const t = todayIdx();
  const dayBar = `<div class="dayf" id="dayf"><button data-d="" class="${state.day === null ? 'on' : ''}">All</button>${DAYS.map((d, i) => `<button data-d="${i}" class="${state.day === i ? 'on' : ''}${i === t ? ' today' : ''}">${d}</button>`).join('')}</div>`;
  view.innerHTML = topbar('Clients', `<button class="icon-btn" id="add" aria-label="Add client">${I.plus}</button>`, searchBox('q', 'Search customer ID or name', state.qc) + dayBar)
    + `<div class="count" id="count"></div><div id="list"></div>`;
  const draw = () => {
    const rows = db.clients.filter(c => (state.day === null || c.days.includes(state.day)) && match(state.qc, c.id, c.name, c.phone)).sort(byId);
    const filtered = state.qc || state.day !== null;
    $('#count').textContent = !db.clients.length ? '' : (filtered ? `${rows.length} of ${plural(db.clients.length, 'client')}` : plural(db.clients.length, 'client')) + (state.day !== null ? ` · delivery ${DAYS[state.day]}` : '');
    $('#list').innerHTML = !db.clients.length
      ? emptyHTML('No clients yet', 'Add your first client, or import a list<br>from the Import / Export tab.', 'addEmpty', 'Add client')
      : !rows.length ? `<div class="empty">No clients ${state.day !== null ? `with delivery on ${DAYS[state.day]}` : ''}${state.qc ? ` matching “${esc(state.qc)}”` : ''}</div>`
      : `<div class="list">${rows.map(c => `<a class="row" href="#/client/${enc(c.id)}"><span class="idb">${esc(c.id)}</span><span class="main"><span class="name">${esc(c.name || '(no name)')}</span><span class="sub">${[plural(c.items.length, 'item'), (n => n ? plural(n, 'promo') : '')(c.promos.filter(i => getPromo(i.promoId)?.active).length), fmtDays(c.days), c.phone].filter(Boolean).map(esc).join(' · ')}</span></span>${I.chev}</a>`).join('')}</div>`;
    const ae = $('#addEmpty'); if(ae) ae.onclick = () => clientForm(null);
  };
  $('#q').addEventListener('input', e => { state.qc = e.target.value; draw(); });
  $('#dayf').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return;
    state.day = b.dataset.d === '' ? null : +b.dataset.d;
    $('#dayf').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  $('#add').onclick = () => clientForm(null);
  draw();
}

function clientForm(c){
  const isNew = !c;
  formSheet({
    title: isNew ? 'New client' : 'Edit client', saveLabel: isNew ? 'Add' : 'Save',
    fields: [
      {k:'id', label:'Customer ID', value: isNew ? nextId(db.clients, 'C') : c.id, ac:'characters'},
      {k:'name', label:'Name', value: c?.name || '', ph:'Business name', ac:'words'},
      {k:'phone', label:'Phone', value: c?.phone || '', type:'tel'},
      {k:'days', label:'Delivery days', value: c?.days || [], days:true},
      {k:'notes', label:'Notes', value: c?.notes || '', area:true, ph:'Address, contact, delivery time…'}
    ],
    onSave: v => {
      if(!v.id) return 'Customer ID is required';
      if(!v.name) return 'Name is required';
      const clash = getClient(v.id);
      if(clash && clash !== c) return `Customer ID ${v.id} is already used by ${clash.name}`;
      if(isNew){
        db.clients.push({id:v.id, name:v.name, phone:v.phone, days:cleanDays(v.days), notes:v.notes, items:[], promos:[]});
        save(); toast('Client added'); location.hash = '#/client/' + enc(v.id);
      } else {
        const oldId = c.id; Object.assign(c, {id:v.id, name:v.name, phone:v.phone, days:cleanDays(v.days), notes:v.notes}); save(); toast('Saved');
        if(oldId !== v.id) location.replace('#/client/' + enc(v.id)); else route();
      }
    },
    onDelete: isNew ? null : () => {
      if(!confirm(`Delete ${c.name} (${c.id})?\nTheir stock and promo lists will be removed too.`)) return;
      db.clients = db.clients.filter(x => x !== c); save(); toast('Client deleted'); location.hash = '#/clients';
    }
  });
}

function viewClient(id){
  setTab('clients');
  const c = getClient(id);
  if(!c){ view.innerHTML = backbar('#/clients', 'Clients') + `<div class="empty"><b>Client not found</b>It may have been deleted or renamed.</div>`; return; }
  let q = '';
  const dayChips = c.days.length ? `<div class="chips">${c.days.length === 7 ? '<span class="chip">Daily</span>' : c.days.map(i => `<span class="chip">${DAYS[i]}</span>`).join('')}</div>` : '';
  // inactive promos stay linked to the client but are hidden until switched back on
  const prs = c.promos.map(it => ({it, p:getPromo(it.promoId)})).filter(x => x.p && x.p.active).sort((a, b) => cmp(a.it.promoId, b.it.promoId));
  view.innerHTML = backbar('#/clients', 'Clients', `<button class="link-btn" id="edit">Edit</button>`)
    + `<section class="hero"><div class="idrow"><span class="idb lg">${esc(c.id)}</span>${dayChips}</div><h1>${esc(c.name || '(no name)')}</h1>`
    + (c.phone ? `<a class="meta" href="tel:${esc(c.phone.replace(/[^\d+]/g, ''))}">${I.phone}${esc(c.phone)}</a>` : '')
    + (c.notes ? `<p class="notes">${esc(c.notes)}</p>` : '') + `</section>`
    + `<div class="btn2"><button class="primary" id="addStock">${I.plus} Add stock</button><button class="primary alt" id="addPromo">${I.plus} Add promo</button></div>`
    + `<div class="sec-h"><span>Ordered · ${[prs.length ? plural(prs.length, 'promo') : '', plural(c.items.length, 'stock item')].filter(Boolean).join(' · ')}</span></div>`
    + (prs.length + c.items.length > 8 ? `<div style="margin-top:8px">${searchBox('qi', 'Filter this client’s list', '')}</div>` : '')
    + `<div id="items"></div>`;
  const draw = () => {
    const pRows = prs.filter(({it, p}) => match(q, 'promo', it.promoId, p?.name, it.note));
    const sRows = c.items.map(it => ({it, s:getStock(it.stockId)}))
      .filter(({it, s}) => match(q, it.stockId, s?.name, s?.brand, s?.unit, it.note))
      .sort((a, b) => cmp(a.it.stockId, b.it.stockId));
    $('#items').innerHTML = !c.items.length && !prs.length
      ? `<div class="empty sm">Nothing yet. Tap <b style="display:inline;font-size:inherit">Add stock</b> or <b style="display:inline;font-size:inherit">Add promo</b>.</div>`
      : !pRows.length && !sRows.length ? `<div class="empty">Nothing matches “${esc(q)}”</div>`
      : `<div class="list">${pRows.map(({it, p}) => {
          const sub = [p ? plural(p.stockIds.length, 'stock item') : '', it.note, it.added ? 'since ' + fmtDate(it.added) : ''].filter(Boolean).map(esc).join(' · ');
          return `<button class="row" data-pid="${esc(it.promoId)}"><span class="idb pr">${esc(it.promoId)}</span><span class="main"><span class="name">${p ? esc(p.name || '(no name)') : '<i>Promo deleted</i>'}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</span>${p && !p.active ? '<span class="tag">Inactive</span>' : ''}${I.chev}</button>`;
        }).join('')}${sRows.map(({it, s}) => {
          const sub = [s?.brand, s?.unit, it.note, it.added ? 'since ' + fmtDate(it.added) : ''].filter(Boolean).map(esc).join(' · ');
          return `<button class="row" data-sid="${esc(it.stockId)}"><span class="idb">${esc(it.stockId)}</span><span class="main"><span class="name">${s ? esc(s.name || '(no name)') : '<i>Stock item deleted</i>'}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</span>${I.chev}</button>`;
        }).join('')}</div>`;
  };
  $('#edit').onclick = () => clientForm(c);
  $('#addStock').onclick = () => pickStock(c);
  $('#addPromo').onclick = () => pickPromo(c);
  const qi = $('#qi'); if(qi) qi.addEventListener('input', e => { q = e.target.value; draw(); });
  $('#items').addEventListener('click', e => {
    const r = e.target.closest('.row[data-sid], .row[data-pid]'); if(!r) return;
    if(r.dataset.pid !== undefined){ const it = c.promos.find(i => i.promoId === r.dataset.pid); if(it) clientPromoSheet(c, it); }
    else { const it = c.items.find(i => i.stockId === r.dataset.sid); if(it) itemSheet(c, it); }
  });
  draw();
}

function clientPromoSheet(c, it){
  const p = getPromo(it.promoId);
  const elig = p ? p.stockIds.map(sid => ({sid, s:getStock(sid)})).sort((a, b) => cmp(a.sid, b.sid)) : [];
  formSheet({
    title: p ? p.name || it.promoId : it.promoId,
    fields: [{k:'note', label:'Note', value: it.note, area:true, ph:'e.g. agreed price, start date…'}],
    extra: `<p class="sheet-note">Promo ID ${esc(it.promoId)}${p ? ` · ${p.active ? 'Active' : 'Inactive'} · <a href="#/promo/${enc(p.id)}">View promo</a>` : ''}${it.added ? ' · added ' + fmtDate(it.added) : ''}</p>`
      + (elig.length ? `<div class="sec-h"><span>Stock in this promo · ${elig.length}</span></div><div class="list mini">${elig.map(({sid, s}) => `<div class="row"><span class="idb">${esc(sid)}</span><span class="main"><span class="name">${s ? esc(s.name || '(no name)') : '<i>Stock item deleted</i>'}</span>${s && stockSub(s) ? `<span class="sub">${esc(stockSub(s))}</span>` : ''}</span></div>`).join('')}</div>` : ''),
    onSave: v => { it.note = v.note; save(); route(); toast('Saved'); },
    deleteLabel: 'Remove promo from this client',
    onDelete: () => { c.promos = c.promos.filter(x => x !== it); save(); route(); toast('Removed'); }
  });
}

function itemSheet(c, it){
  const s = getStock(it.stockId);
  formSheet({
    title: s ? s.name || it.stockId : it.stockId,
    fields: [{k:'note', label:'Note', value: it.note, area:true, ph:'e.g. 20 kg weekly, cut 1 cm, price agreed…'}],
    extra: `<p class="sheet-note">Stock ID ${esc(it.stockId)}${s?.brand ? ' · ' + esc(s.brand) : ''}${s?.unit ? ' · ' + esc(s.unit) : ''}${it.added ? ' · added ' + fmtDate(it.added) : ''}${s ? ` · <a href="#/stock/${enc(s.id)}">View stock item</a>` : ''}</p>`,
    onSave: v => { it.note = v.note; save(); route(); toast('Saved'); },
    deleteLabel: 'Remove from this client',
    onDelete: () => { c.items = c.items.filter(x => x !== it); save(); route(); toast('Removed'); }
  });
}

function pickList({title, items, have, ph, empty, sub, onAdd}){
  const sel = new Set();
  let q = '';
  openSheet(`<div class="sh"><button class="link-btn l" data-x>Cancel</button><b>${esc(title)}</b><button class="link-btn r" id="padd" disabled>Add</button></div>
    <div class="sb">${searchBox('pq', ph, '')}<div id="plist"></div></div>`);
  const btn = $('#padd');
  const sync = () => { btn.disabled = !sel.size; btn.textContent = sel.size ? `Add (${sel.size})` : 'Add'; };
  const draw = () => {
    const rows = items.filter(x => match(q, x.id, x.name, sub(x))).sort(byId);
    $('#plist').innerHTML = !items.length ? `<div class="empty">${empty}</div>`
      : !rows.length ? `<div class="empty">Nothing matches “${esc(q)}”</div>`
      : `<div class="list">${rows.map(x => { const h = have.has(x.id), on = sel.has(x.id), sb = sub(x);
          return `<button class="row${on ? ' on' : ''}" data-id="${esc(x.id)}"${h ? ' disabled' : ''}><span class="ck">${on || h ? I.check : ''}</span><span class="idb">${esc(x.id)}</span><span class="main"><span class="name">${esc(x.name || '(no name)')}</span>${sb ? `<span class="sub">${esc(sb)}</span>` : ''}</span>${h ? '<span class="tag">Added</span>' : ''}</button>`;
        }).join('')}</div>`;
  };
  $('#pq').addEventListener('input', e => { q = e.target.value; draw(); });
  $('#plist').addEventListener('click', e => {
    const r = e.target.closest('.row[data-id]'); if(!r || r.disabled) return;
    const id = r.dataset.id;
    if(sel.has(id)) sel.delete(id); else sel.add(id);
    r.classList.toggle('on', sel.has(id)); r.querySelector('.ck').innerHTML = sel.has(id) ? I.check : '';
    sync();
  });
  btn.onclick = () => { const msg = onAdd([...sel]); save(); route(); toast(msg); };
  draw();
}
function pickStock(c){
  pickList({title:'Add stock', items:db.stock, have:new Set(c.items.map(i => i.stockId)), ph:'Search stock ID or name',
    empty:'<b>No stock items yet</b>Add items in the <a href="#/stock">Stock</a> tab first.', sub:stockSub,
    onAdd: ids => { const d = localDate(); ids.forEach(id => c.items.push({stockId:id, note:'', added:d})); return `Added ${plural(ids.length, 'item')}`; }});
}
function pickPromo(c){
  pickList({title:'Add promo', items:db.promos.filter(p => p.active), have:new Set(c.promos.map(i => i.promoId)), ph:'Search promo ID or name',
    empty: db.promos.length ? '<b>No active promos</b>Switch a promo on in the <a href="#/promo">Promo</a> tab.' : '<b>No promos yet</b>Create one in the <a href="#/promo">Promo</a> tab first.',
    sub: p => plural(p.stockIds.length, 'stock item'),
    onAdd: ids => { const d = localDate(); ids.forEach(id => c.promos.push({promoId:id, note:'', added:d})); return `Added ${plural(ids.length, 'promo')}`; }});
}

/* ---------- stock ---------- */
const usage = id => db.clients.filter(c => c.items.some(i => i.stockId === id));

function viewStock(){
  setTab('stock');
  view.innerHTML = topbar('Stock', `<button class="icon-btn" id="add" aria-label="Add stock item">${I.plus}</button>`, searchBox('q', 'Search stock ID or name', state.qs))
    + `<div class="count" id="count"></div><div id="list"></div>`;
  const draw = () => {
    const counts = {}; db.clients.forEach(c => c.items.forEach(i => counts[i.stockId] = (counts[i.stockId] || 0) + 1));
    const rows = db.stock.filter(s => match(state.qs, s.id, s.name, s.brand, s.unit)).sort(byId);
    $('#count').textContent = !db.stock.length ? '' : state.qs ? `${rows.length} of ${plural(db.stock.length, 'item')}` : plural(db.stock.length, 'item');
    $('#list').innerHTML = !db.stock.length
      ? emptyHTML('No stock items yet', 'Add the products you sell, or import<br>a list from the Import / Export tab.', 'addEmpty', 'Add stock item')
      : !rows.length ? `<div class="empty">No stock matches “${esc(state.qs)}”</div>`
      : `<div class="list">${rows.map(s => { const n = counts[s.id] || 0;
          return `<a class="row" href="#/stock/${enc(s.id)}"><span class="idb">${esc(s.id)}</span><span class="main"><span class="name">${esc(s.name || '(no name)')}</span><span class="sub">${[s.brand, s.unit, n ? plural(n, 'client') : 'no clients yet'].filter(Boolean).map(esc).join(' · ')}</span></span>${I.chev}</a>`;
        }).join('')}</div>`;
    const ae = $('#addEmpty'); if(ae) ae.onclick = () => stockForm(null);
  };
  $('#q').addEventListener('input', e => { state.qs = e.target.value; draw(); });
  $('#add').onclick = () => stockForm(null);
  draw();
}

function stockForm(s){
  const isNew = !s;
  formSheet({
    title: isNew ? 'New stock item' : 'Edit stock item', saveLabel: isNew ? 'Add' : 'Save',
    fields: [
      {k:'id', label:'Stock ID', value: isNew ? nextId(db.stock, 'S') : s.id, ac:'characters'},
      {k:'name', label:'Name', value: s?.name || '', ph:'e.g. Beef shin (Brazil)'},
      {k:'brand', label:'Brand', value: s?.brand || '', ph:'Brand / packer'},
      {k:'unit', label:'Unit', value: s?.unit || '', ph:'kg, box, carton…'},
      {k:'notes', label:'Notes', value: s?.notes || '', area:true}
    ],
    onSave: v => {
      if(!v.id) return 'Stock ID is required';
      if(!v.name) return 'Name is required';
      const clash = getStock(v.id);
      if(clash && clash !== s) return `Stock ID ${v.id} is already used by ${clash.name}`;
      if(isNew){
        db.stock.push({id:v.id, name:v.name, brand:v.brand, unit:v.unit, notes:v.notes}); save(); route(); toast('Stock item added');
      } else {
        const oldId = s.id;
        if(oldId !== v.id){ db.clients.forEach(c => c.items.forEach(i => { if(i.stockId === oldId) i.stockId = v.id; }));
          db.promos.forEach(p => p.stockIds = p.stockIds.map(x => x === oldId ? v.id : x)); }
        Object.assign(s, {id:v.id, name:v.name, brand:v.brand, unit:v.unit, notes:v.notes}); save(); toast('Saved');
        if(oldId !== v.id && location.hash.startsWith('#/stock/')) location.replace('#/stock/' + enc(v.id)); else route();
      }
    },
    onDelete: isNew ? null : () => {
      const n = usage(s.id).length, np = db.promos.filter(p => p.stockIds.includes(s.id)).length;
      const also = [n ? plural(n, 'client') : '', np ? plural(np, 'promo') : ''].filter(Boolean).join(' and ');
      if(!confirm(`Delete ${s.name} (${s.id})?` + (also ? `\nIt will also be removed from ${also}.` : ''))) return;
      db.stock = db.stock.filter(x => x !== s);
      db.clients.forEach(c => c.items = c.items.filter(i => i.stockId !== s.id));
      db.promos.forEach(p => p.stockIds = p.stockIds.filter(x => x !== s.id));
      save(); toast('Stock item deleted'); location.hash = '#/stock';
    }
  });
}

function viewStockItem(id){
  setTab('stock');

function promoForm(p){
  const isNew = !p;
  formSheet({
    title: isNew ? 'New promo' : 'Edit promo', saveLabel: isNew ? 'Add' : 'Save',
    fields: [
      {k:'id', label:'Promo ID', value: isNew ? nextId(db.promos, 'P') : p.id, ac:'characters'},
      {k:'name', label:'Name', value: p?.name || '', ph:'e.g. Hotpot season special'},
      {k:'active', label:'Active', value: isNew ? true : p.active, toggle:true},
      {k:'notes', label:'Details', value: p?.notes || '', area:true, ph:'Discount, price, dates, conditions…'}
    ],
    onSave: v => {
      if(!v.id) return 'Promo ID is required';
      if(!v.name) return 'Name is required';
      const clash = getPromo(v.id);
      if(clash && clash !== p) return `Promo ID ${v.id} is already used by ${clash.name}`;
      if(isNew){
        db.promos.push({id:v.id, name:v.name, active:v.active, stockIds:[], notes:v.notes});
        save(); toast('Promo added — now add its stock items'); location.hash = '#/promo/' + enc(v.id);
      } else {
        const oldId = p.id;
        if(oldId !== v.id) db.clients.forEach(c => c.promos.forEach(i => { if(i.promoId === oldId) i.promoId = v.id; }));
        Object.assign(p, {id:v.id, name:v.name, active:v.active, notes:v.notes}); save(); toast('Saved');
        if(oldId !== v.id && location.hash.startsWith('#/promo/')) location.replace('#/promo/' + enc(v.id)); else route();
      }
    },
    onDelete: isNew ? null : () => {
      const n = promoClients(p.id).length;
      if(!confirm(`Delete promo ${p.name} (${p.id})?` + (n ? `\nIt will also be removed from ${plural(n, 'client')}.` : ''))) return;
      db.promos = db.promos.filter(x => x !== p);
      db.clients.forEach(c => c.promos = c.promos.filter(i => i.promoId !== p.id));
      save(); toast('Promo deleted'); location.hash = '#/promo';
    }
  });
}

async function saveFile(name, text, type){
  const blob = new Blob([text], {type});
  try{
    const f = new File([blob], name, {type});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f]}); return true;
    }
  }catch(e){ if(e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}

const csvCell = v => { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const cnt = ch => first.split(ch).length - 1;
  const d = cnt('\t') > cnt(',') && cnt('\t') >= cnt(';') ? '\t' : cnt(';') > cnt(',') ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === d){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const normH = s => String(s).toLowerCase().replace(/[^a-z0-9㐀-鿿]/g, '');
function readTable(text){
  const rows = parseCSV(text);
  if(!rows.length) throw new Error('the file is empty');
  return {head: rows[0].map(normH), rows: rows.slice(1)};
}
const col = (head, al) => { for(const a of al){ const i = head.indexOf(a); if(i >= 0) return i; } return -1; };
const AL = {
  cid: ['customerid','clientid','custid','customerno','clientno','customercode','clientcode','客戶編號','客户编号'],
  sid: ['stockid','itemid','productid','stockcode','itemcode','productcode','sku','stockno','itemno','貨品編號','货品编号'],
  cname: ['customername','clientname','customer','client','客戶名稱','客戶'],
  sname: ['stockname','itemname','productname','item','product','description','貨品名稱','貨品'],
  name: ['name','名稱'], phone: ['phone','tel','telephone','mobile','contact','電話'], unit: ['unit','uom','單位'], brand: ['brand','brandname','packer','品牌','牌子'], days: ['deliverydays','deliveryday','delivery','days','送貨日','送貨日期'],
  notes: ['notes','note','remarks','remark','comment','comments','備註','details'], added: ['added','date','since'],
  pid: ['promoid','promocode','promotionid','promotioncode','promo','promotion','優惠編號'], pname: ['promoname','promotionname','優惠名稱','優惠'],
  active: ['active','status','enabled','狀態'], sids: ['stockids','stockid','stockitems','items','stock','eligiblestock','貨品編號']
};
const getter = r => i => i < 0 ? '' : String(r[i] ?? '').trim();

function importClients(t){
  const H = t.head, ci = col(H, [...AL.cid, 'id', 'code', 'no', '編號']), ni = col(H, [...AL.name, ...AL.cname]), pi = col(H, AL.phone), di = col(H, AL.days), oi = col(H, AL.notes);
  if(ci < 0) return toast('No customer ID column found. The first row should include "customer_id".', 4500);
  let add = 0, upd = 0, skip = 0;
  for(const r of t.rows){ const g = getter(r), id = g(ci); if(!id){ skip++; continue; }
    const c = getClient(id);
    if(c){ if(g(ni)) c.name = g(ni); if(g(pi)) c.phone = g(pi); if(g(di)) c.days = parseDays(g(di)); if(g(oi)) c.notes = g(oi); upd++; }
    else { db.clients.push({id, name:g(ni), phone:g(pi), days:parseDays(g(di)), notes:g(oi), items:[], promos:[]}); add++; } }
  save(); route(); toast(`Clients: ${add} added, ${upd} updated${skip ? `, ${skip} skipped (no ID)` : ''}`, 4000);
}
function importStock(t){
  const H = t.head, si = col(H, [...AL.sid, 'id', 'code', 'no', '編號']), ni = col(H, [...AL.name, ...AL.sname]), ui = col(H, AL.unit), bi = col(H, AL.brand), oi = col(H, AL.notes);
  if(si < 0) return toast('No stock ID column found. The first row should include "stock_id".', 4500);
  let add = 0, upd = 0, skip = 0;
  for(const r of t.rows){ const g = getter(r), id = g(si); if(!id){ skip++; continue; }
    const s = getStock(id);
    if(s){ if(g(ni)) s.name = g(ni); if(g(bi)) s.brand = g(bi); if(g(ui)) s.unit = g(ui); if(g(oi)) s.notes = g(oi); upd++; }
    else { db.stock.push({id, name:g(ni), brand:g(bi), unit:g(ui), notes:g(oi)}); add++; } }
  save(); route(); toast(`Stock: ${add} added, ${upd} updated${skip ? `, ${skip} skipped (no ID)` : ''}`, 4000);
}
function importOrders(t){
  const H = t.head, ci = col(H, AL.cid), si = col(H, AL.sid), cn = col(H, AL.cname), sn = col(H, AL.sname), ui = col(H, AL.unit), bi = col(H, AL.brand), ni = col(H, AL.notes), di = col(H, AL.added), dd = col(H, AL.days);
  if(ci < 0 || si < 0) return toast('Need both "customer_id" and "stock_id" columns in the first row.', 4500);
  let link = 0, dup = 0, newC = 0, newS = 0, skip = 0;
  const cMap = new Map(db.clients.map(c => [c.id, c])), sMap = new Map(db.stock.map(s => [s.id, s]));
  for(const r of t.rows){ const g = getter(r), cid = g(ci), sid = g(si); if(!cid || !sid){ skip++; continue; }
    let c = cMap.get(cid); if(!c){ c = {id:cid, name:g(cn), phone:'', days:parseDays(g(dd)), notes:'', items:[], promos:[]}; db.clients.push(c); cMap.set(cid, c); newC++; } else if(!c.name && g(cn)) c.name = g(cn);
    let s = sMap.get(sid); if(!s){ s = {id:sid, name:g(sn), brand:g(bi), unit:g(ui), notes:''}; db.stock.push(s); sMap.set(sid, s); newS++; }
    const ex = c.items.find(i => i.stockId === sid);
    if(ex){ dup++; if(g(ni)) ex.note = g(ni); }
    else { c.items.push({stockId:sid, note:g(ni), added:g(di) || localDate()}); link++; } }
  save(); route();
  toast(`Orders: ${link} linked${dup ? `, ${dup} already there` : ''}${newC ? `, ${newC} new clients` : ''}${newS ? `, ${newS} new stock` : ''}${skip ? `, ${skip} skipped` : ''}`, 4500);
}
const parseActive = v => !/^(no|n|false|0|inactive|off|disabled|否|停用)$/i.test(String(v).trim());
function importPromos(t){
  const H = t.head, pi = col(H, [...AL.pid, 'id', 'code', 'no', '編號']), ni = col(H, [...AL.name, ...AL.pname]), ai = col(H, AL.active), si = col(H, AL.sids), oi = col(H, AL.notes);
  if(pi < 0) return toast('No promo ID column found. The first row should include "promo_id".', 4500);
  let add = 0, upd = 0, skip = 0, newS = 0;
  for(const r of t.rows){ const g = getter(r), id = g(pi); if(!id){ skip++; continue; }
    const sids = g(si) ? [...new Set(g(si).split(/[;,|\/\s]+/).map(x => x.trim()).filter(Boolean))] : null;
    if(sids) sids.forEach(sid => { if(!getStock(sid)){ db.stock.push({id:sid, name:'', brand:'', unit:'', notes:''}); newS++; } });
    const p = getPromo(id);
    if(p){ if(g(ni)) p.name = g(ni); if(g(ai)) p.active = parseActive(g(ai)); if(sids) p.stockIds = sids; if(g(oi)) p.notes = g(oi); upd++; }
    else { db.promos.push({id, name:g(ni), active: g(ai) ? parseActive(g(ai)) : true, stockIds: sids || [], notes:g(oi)}); add++; } }
  save(); route(); toast(`Promos: ${add} added, ${upd} updated${newS ? `, ${newS} new stock IDs created` : ''}${skip ? `, ${skip} skipped (no ID)` : ''}`, 4500);
}
function importClientPromos(t){
  const H = t.head, ci = col(H, AL.cid), pi = col(H, AL.pid), cn = col(H, AL.cname), pn = col(H, AL.pname), ni = col(H, AL.notes), di = col(H, AL.added);
  if(ci < 0 || pi < 0) return toast('Need both "customer_id" and "promo_id" columns in the first row.', 4500);
  let link = 0, dup = 0, newC = 0, newP = 0, skip = 0;
  for(const r of t.rows){ const g = getter(r), cid = g(ci), pid = g(pi); if(!cid || !pid){ skip++; continue; }
    let c = getClient(cid); if(!c){ c = {id:cid, name:g(cn), phone:'', days:[], notes:'', items:[], promos:[]}; db.clients.push(c); newC++; }
    if(!getPromo(pid)){ db.promos.push({id:pid, name:g(pn), active:true, stockIds:[], notes:''}); newP++; }
    const ex = c.promos.find(i => i.promoId === pid);
    if(ex){ dup++; if(g(ni)) ex.note = g(ni); }
    else { c.promos.push({promoId:pid, note:g(ni), added:g(di) || localDate()}); link++; } }
  save(); route();
  toast(`Client promos: ${link} linked${dup ? `, ${dup} already there` : ''}${newC ? `, ${newC} new clients` : ''}${newP ? `, ${newP} new promos` : ''}${skip ? `, ${skip} skipped` : ''}`, 4500);
}
function importJSON(text){
  let d; try{ d = JSON.parse(text.replace(/^﻿/, '')); }catch(e){ return toast('That is not a valid backup file'); }
  if(!d || !Array.isArray(d.clients) || !Array.isArray(d.stock)) return toast('That is not a ClientBook backup');
  const clean = normalizeDB(d);
  const sum = x => `${plural(x.clients.length, 'client')}, ${plural(x.stock.length, 'stock item')}, ${plural(x.promos.length, 'promo')}`;
  if(!confirm(`Replace current data (${sum(db)})\nwith this backup (${sum(clean)})?`)) return;
  db = clean; save(); route(); toast('Backup restored');
}
